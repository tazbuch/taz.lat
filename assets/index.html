<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Taz.Lat Assets Viewer</title>
  <style>
    body { 
      font-family: sans-serif; 
      background: #fafafa; 
      padding: 20px; 
    }
    ul { list-style: none; padding: 0; }
    li { margin: 8px 0; padding: 8px; background: #fff; border-radius: 6px; }
    a { color: #0366d6; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>Assets Folder Contents</h1>
  <ul id="assetList">Loading…</ul>

  <script>
    const owner = "tazbuch";
    const repo = "taz.lat";
    const path = "assets";
    async function loadAssets() {
      const resp = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`);
      if (!resp.ok) {
        document.getElementById("assetList").innerText = `Error: ${resp.status}`;
        return;
      }
      const files = await resp.json();
      const ul = document.getElementById("assetList");
      ul.innerHTML = "";
      files.forEach(f => {
        if (f.type === "file") {
          const li = document.createElement("li");
          li.innerHTML = `<a href="${f.download_url}" download>${f.name}</a>`;
          ul.appendChild(li);
        }
      });
    }
    loadAssets().catch(err => {
      document.getElementById("assetList").innerText = "Fetch error";
      console.error(err);
    });
  </script>
</body>
</html>
